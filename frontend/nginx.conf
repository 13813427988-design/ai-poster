server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;

    # nginx:alpine 的 stock nginx.conf 里 gzip 是注释掉的,不显式打开就等于关闭:
    # 实测 JS bundle 197.6KB、CSS 8.9KB 全部按原样发出(压缩后约 62.7KB / 2.7KB)。
    # 服务器出网实测只有 200–350KB/s,这几百 KB 是用户能直接感知到的首屏时间。
    # 图片(png/jpg/webp)本身已是压缩格式,再压一遍只烧 CPU 不省字节,故不列入。
    gzip on;
    # 小响应压完可能反而变大,且省下的字节抵不上一个 RTT,1KB 以下不压
    gzip_min_length 1024;
    # gzip_comp_level 默认是 1,对这个 bundle 只能压到 72.7KB;实测同一文件
    # level 1 / 5 / 6 分别是 72745 / 62538 / 61947 字节,CPU 是 3.9 / 6.7 / 9.1ms。
    # 从 1 提到 5 多花 2.8ms CPU 省下 10.2KB,按 200–350KB/s 折算是 30–50ms 传输时间,
    # 划算;再提到 6 只多省 591 字节,不值,所以停在 5。
    gzip_comp_level 5;
    # text/html 是 gzip_types 的隐含默认值,写进去 nginx -t 会报
    # duplicate MIME type "text/html" 警告,所以这里故意不重复列出
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;
    # 同一 URL 会有压缩/未压缩两种响应体,不带 Vary 的话中间层缓存可能把 gzip
    # 响应喂给不支持 gzip 的客户端
    gzip_vary on;

    # 尾斜杠让 /api/generate 转发为 /generate,与 vite dev server 的 rewrite 行为一致
    location /api/ {
        proxy_pass http://backend:8080/;
        # 默认用 HTTP/1.0 与上游通信,每个请求都带 Connection: close,
        # 无法复用到 backend 的连接;1.1 是 keepalive 与分块传输的前提
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 目前后端不从请求头推导 URL(PUBLIC_URL 是显式配置),但将来若在上游终止
        # TLS,后端只有靠这个头才能知道外部其实是 https
        proxy_set_header X-Forwarded-Proto $scheme;
        # 文生图慢;nginx 默认 60s 会在后端仍在正常执行时截断,前端看到 504。
        # 180s 是兜底而非主约束:后端 handler 自己有 170s 的总预算
        # (handler/generate.go 的 requestTimeout),正常情况下由它先返回带阶段信息的
        # 500,而不是让 nginx 抛一个没有信息量的 504。两个数字是一对约束,
        # 改这里要同时改那边,始终保持 requestTimeout < proxy_read_timeout。
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # 海报与占位图由 backend 提供
    location /static/ {
        proxy_pass http://backend:8080/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # 边缘健康检查。没有这条 location 时 /healthz 会掉进下面 location / 的 SPA
    # 兜底,返回 200 + index.html 的 HTML 正文 —— 也就是说无论 backend 死活,
    # 探针都恒为 200(实测:未加此段时 curl /healthz 返回的是 index.html,
    # 与 /totally-bogus-path 一样)。健康检查恒真比没有健康检查更危险,所以这里
    # 显式转发到 backend,让 /healthz 真正代表"整条链路可用"。
    #
    # 用 = 精确匹配:只接管这一个路径,不影响任何前端路由。
    location = /healthz {
        proxy_pass http://backend:8080/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 探针要快失败:backend 卡住时不该让它挂在这里等 180s
        proxy_read_timeout 5s;
        proxy_connect_timeout 2s;
    }

    # vite 产物是内容哈希命名(index-CB4h9Yuc.js),文件名变了内容才会变,
    # 所以可以按 immutable 长期缓存,客户端连 304 探测都不用发。
    # 注意不要给 index.html 加缓存头:它的文件名固定,一旦被缓存住,
    # 发版后客户端会一直指向旧 bundle。
    #
    # try_files ... =404 是为了绕开 location / 的 SPA 兜底:走兜底的话
    # 缺失的 /assets/xxx.js 会返回 200 + index.html 的 HTML 正文,
    # 浏览器按 JS 解析后报 MIME/语法错(发版后开着的旧标签页正是这种情况),
    # 直接 404 才能让失败原因一眼可见。
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
